<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ระบบจัดการงาน</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #dbeafe, #fce7f3);
    min-height: 100vh;
    padding: 20px;
}

.container {
    max-width: 750px;
    margin: auto;
}

.header {
    text-align: center;
    margin-bottom: 20px;
}

.header h1 {
    margin-bottom: 5px;
}

.header p {
    color: #666;
}

.box,
.task,
.stats {
    background: white;
    padding: 20px;
    margin-bottom: 15px;
    border-radius: 18px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.08);
}

h2 {
    margin-top: 0;
}

label {
    font-weight: bold;
}

input {
    width: 100%;
    padding: 12px;
    margin: 7px 0 15px;
    border: 1px solid #ddd;
    border-radius: 10px;
    font-size: 16px;
}

button {
    padding: 11px 16px;
    margin: 4px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-size: 15px;
}

.save {
    background: #22c55e;
    color: white;
    width: 100%;
}

.done {
    background: #3b82f6;
    color: white;
}

.delete {
    background: #ef4444;
    color: white;
}

.notify {
    background: #8b5cf6;
    color: white;
    width: 100%;
    margin-top: 10px;
}

.filter {
    background: #e5e7eb;
    color: #333;
}

.filter.active {
    background: #111827;
    color: white;
}

.search {
    margin-bottom: 10px;
}

.stats {
    display: flex;
    justify-content: space-around;
    text-align: center;
}

.stat-number {
    font-size: 28px;
    font-weight: bold;
}

.task h3 {
    margin-top: 0;
}

.completed {
    text-decoration: line-through;
    opacity: 0.5;
}

.task.today {
    border-left: 6px solid #ef4444;
}

.task.soon {
    border-left: 6px solid #f59e0b;
}

.badge {
    display: inline-block;
    padding: 5px 9px;
    border-radius: 8px;
    font-size: 13px;
    margin-bottom: 8px;
}

.badge-today {
    background: #fee2e2;
    color: #b91c1c;
}

.badge-soon {
    background: #fef3c7;
    color: #92400e;
}

.badge-normal {
    background: #dcfce7;
    color: #166534;
}

.empty {
    text-align: center;
    color: #777;
    padding: 20px;
}

.filter-area {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>📚 ระบบจัดการงาน</h1>
        <p>จัดการงานและกำหนดส่งของคุณได้ง่าย ๆ</p>
    </div>

    <div class="stats">

        <div>
            <div class="stat-number" id="total">0</div>
            <div>งานทั้งหมด</div>
        </div>

        <div>
            <div class="stat-number" id="completed">0</div>
            <div>เสร็จแล้ว</div>
        </div>

        <div>
            <div class="stat-number" id="remaining">0</div>
            <div>ค้างอยู่</div>
        </div>

    </div>

    <div class="box">

        <h2>➕ เพิ่มงานใหม่</h2>

        <label>วิชา</label>
        <input
            id="subject"
            type="text"
            placeholder="เช่น คณิตศาสตร์"
        >

        <label>ชื่องาน</label>
        <input
            id="task"
            type="text"
            placeholder="เช่น แบบฝึกหัดบทที่ 3"
        >

        <label>วันส่ง</label>
        <input id="date" type="date">

        <label>เวลาส่ง</label>
        <input id="time" type="time">

        <button class="save" onclick="addTask()">
            💾 บันทึกงาน
        </button>

        <button class="notify" onclick="requestNotification()">
            🔔 เปิดการแจ้งเตือน
        </button>

    </div>

    <div class="box">

        <h2>🔎 ค้นหาและกรองงาน</h2>

        <input
            id="search"
            class="search"
            type="text"
            placeholder="พิมพ์ชื่อวิชาหรืองาน..."
            oninput="showTasks()"
        >

        <div class="filter-area">

            <button
                id="allBtn"
                class="filter active"
                onclick="setFilter('all')"
            >
                📋 ทั้งหมด
            </button>

            <button
                id="todoBtn"
                class="filter"
                onclick="setFilter('todo')"
            >
                ⏰ ยังไม่เสร็จ
            </button>

            <button
                id="todayBtn"
                class="filter"
                onclick="setFilter('today')"
            >
                🚨 ส่งวันนี้
            </button>

            <button
                id="doneBtn"
                class="filter"
                onclick="setFilter('done')"
            >
                ✅ เสร็จแล้ว
            </button>

        </div>

    </div>

    <h2>📋 งานของฉัน</h2>

    <div id="taskList"></div>

</div>


<script>

let tasks =
    JSON.parse(localStorage.getItem("tasks")) || [];

let currentFilter = "all";


function saveTasks() {

    localStorage.setItem(
        "tasks",
        JSON.stringify(tasks)
    );

}


function addTask() {

    let subject =
        document.getElementById("subject").value.trim();

    let task =
        document.getElementById("task").value.trim();

    let date =
        document.getElementById("date").value;

    let time =
        document.getElementById("time").value;

    if (
        subject === "" ||
        task === "" ||
        date === "" ||
        time === ""
    ) {

        alert("กรุณากรอกข้อมูลให้ครบ");
        return;

    }

    tasks.push({

        subject: subject,
        task: task,
        date: date,
        time: time,
        completed: false,
        notified: false

    });

    saveTasks();
    showTasks();

    document.getElementById("subject").value = "";
    document.getElementById("task").value = "";
    document.getElementById("date").value = "";
    document.getElementById("time").value = "";

}


function setFilter(filter) {

    currentFilter = filter;

    document
        .querySelectorAll(".filter")
        .forEach(function(button) {

            button.classList.remove("active");

        });


    if (filter === "all") {
        document.getElementById("allBtn")
            .classList.add("active");
    }

    if (filter === "todo") {
        document.getElementById("todoBtn")
            .classList.add("active");
    }

    if (filter === "today") {
        document.getElementById("todayBtn")
            .classList.add("active");
    }

    if (filter === "done") {
        document.getElementById("doneBtn")
            .classList.add("active");
    }

    showTasks();

}


function showTasks() {

    let list =
        document.getElementById("taskList");

    let search =
        document
        .getElementById("search")
        .value
        .toLowerCase();

    let now = new Date();

    list.innerHTML = "";

    updateStats();


    let filtered = tasks.filter(function(item) {

        let matchesSearch =

            item.subject
                .toLowerCase()
                .includes(search)

            ||

            item.task
                .toLowerCase()
                .includes(search);


        if (!matchesSearch) {
            return false;
        }


        if (currentFilter === "todo") {
            return !item.completed;
        }


        if (currentFilter === "done") {
            return item.completed;
        }


        if (currentFilter === "today") {

            let deadline =
                new Date(
                    item.date +
                    "T" +
                    item.time
                );

            return (
                deadline.toDateString()
                === now.toDateString()
            );

        }


        return true;

    });


    if (filtered.length === 0) {

        list.innerHTML =
            '<div class="empty">📭 ไม่พบงาน</div>';

        return;

    }


    filtered.forEach(function(item) {

        let index =
            tasks.indexOf(item);

        let deadline =
            new Date(
                item.date +
                "T" +
                item.time
            );

        let difference =
            deadline - now;

        let statusClass = "";
        let badge = "";


        if (
            deadline.toDateString()
            === now.toDateString()
        ) {

            statusClass = "today";

            badge =
                '<span class="badge badge-today">🚨 ส่งวันนี้</span>';

        }

        else if (
            difference > 0 &&
            difference <=
            24 * 60 * 60 * 1000
        ) {

            statusClass = "soon";

            badge =
                '<span class="badge badge-soon">⚠️ ใกล้ถึงกำหนด</span>';

        }

        else if (item.completed) {

            badge =
                '<span class="badge badge-normal">✅ เสร็จแล้ว</span>';

        }


        let completedClass =
            item.completed
            ? "completed"
            : "";


        list.innerHTML += `

            <div class="task ${statusClass} ${completedClass}">

                ${badge}

                <h3>
                    📚 ${item.subject}
                </h3>

                <p>
                    📝 ${item.task}
                </p>

                <p>
                    📅 วันที่ส่ง: ${item.date}
                    <br>
                    ⏰ เวลา: ${item.time}
                </p>

                ${
                    item.completed
                    ?
                    "<p>🎉 งานนี้เสร็จแล้ว!</p>"
                    :
                    `
                    <button
                        class="done"
                        onclick="completeTask(${index})"
                    >
                        ✅ ทำเสร็จแล้ว
                    </button>
                    `
                }

                <button
                    class="delete"
                    onclick="deleteTask(${index})"
                >
                    🗑️ ลบ
                </button>

            </div>

        `;

    });

}


function completeTask(index) {

    tasks[index].completed = true;

    saveTasks();

    showTasks();

}


function deleteTask(index) {

    if (
        confirm("ต้องการลบงานนี้หรือไม่?")
    ) {

        tasks.splice(index, 1);

        saveTasks();

        showTasks();

    }

}


function updateStats() {

    let total =
        tasks.length;

    let completed =
        tasks.filter(
            item => item.completed
        ).length;

    let remaining =
        total - completed;

    document.getElementById("total")
        .innerText = total;

    document.getElementById("completed")
        .innerText = completed;

    document.getElementById("remaining")
        .innerText = remaining;

}


function requestNotification() {

    if (!("Notification" in window)) {

        alert(
            "เบราว์เซอร์นี้ไม่รองรับการแจ้งเตือน"
        );

        return;

    }

    Notification.requestPermission()
        .then(function(permission) {

            if (permission === "granted") {

                new Notification(
                    "🔔 เปิดการแจ้งเตือนแล้ว!"
                );

            }

            else {

                alert(
                    "กรุณาอนุญาตการแจ้งเตือน"
                );

            }

        });

}


function checkDeadline() {

    let now = new Date();

    tasks.forEach(function(item) {

        if (
            item.completed ||
            item.notified
        ) {
            return;
        }

        let deadline =
            new Date(
                item.date +
                "T" +
                item.time
            );

        let difference =
            deadline - now;


        if (
            difference > 0 &&
            difference <=
            60 * 60 * 1000
        ) {

            if (
                "Notification" in window &&
                Notification.permission === "granted"
            ) {

                new Notification(
                    "🔔 ใกล้ถึงกำหนดส่ง!",
                    {
                        body:
                            item.subject +
                            " - " +
                            item.task
                    }
                );

            }

            else {

                alert(
                    "🔔 ใกล้ถึงกำหนดส่ง!\n\n" +
                    item.subject +
                    "\n" +
                    item.task
                );

            }

            item.notified = true;

            saveTasks();

        }

    });

}


setInterval(
    checkDeadline,
    60000
);


showTasks();

</script>

</body>
</html>
