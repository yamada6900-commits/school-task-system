<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Cute Task</title>

<style>

/* =========================
   พื้นฐาน
========================= */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    color: #5b5368;

    background:
        linear-gradient(
            180deg,
            #ffdff0 0%,
            #e7e0ff 45%,
            #dff5ff 100%
        );

    overflow-x: hidden;
}


/* =========================
   ของตกแต่งพื้นหลัง
========================= */

.background {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 0;
}

.cloud {
    position: absolute;
    font-size: 70px;
    opacity: 0.8;
    animation: cloudMove 7s ease-in-out infinite;
}

.cloud1 {
    top: 40px;
    left: 3%;
}

.cloud2 {
    top: 150px;
    right: 4%;
    animation-delay: 2s;
}

.flower {
    position: absolute;
    font-size: 42px;
    animation: flowerFloat 4s ease-in-out infinite;
}

.flower1 {
    top: 35%;
    left: 2%;
}

.flower2 {
    top: 60%;
    right: 3%;
    animation-delay: 1s;
}

.flower3 {
    bottom: 8%;
    left: 5%;
    animation-delay: 2s;
}

.heart {
    position: absolute;
    font-size: 28px;
    animation: heartFloat 5s ease-in-out infinite;
}

.heart1 {
    top: 20%;
    left: 15%;
}

.heart2 {
    top: 30%;
    right: 15%;
    animation-delay: 2s;
}

.heart3 {
    bottom: 20%;
    right: 10%;
    animation-delay: 1s;
}

.star {
    position: absolute;
    font-size: 25px;
    animation: sparkle 2s ease-in-out infinite;
}

.star1 {
    top: 12%;
    left: 35%;
}

.star2 {
    top: 25%;
    right: 30%;
    animation-delay: 1s;
}

.star3 {
    bottom: 15%;
    left: 25%;
    animation-delay: 0.5s;
}

@keyframes cloudMove {
    0%, 100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-15px);
    }
}

@keyframes flowerFloat {
    0%, 100% {
        transform: rotate(-5deg) translateY(0);
    }

    50% {
        transform: rotate(5deg) translateY(-10px);
    }
}

@keyframes heartFloat {
    0%, 100% {
        transform: translateY(0) scale(1);
    }

    50% {
        transform: translateY(-15px) scale(1.15);
    }
}

@keyframes sparkle {
    0%, 100% {
        opacity: 0.4;
        transform: scale(0.8);
    }

    50% {
        opacity: 1;
        transform: scale(1.3);
    }
}


/* =========================
   หน้าเว็บ
========================= */

.container {
    width: 92%;
    max-width: 900px;
    margin: 30px auto;
    position: relative;
    z-index: 1;
}


/* =========================
   หัวเว็บ
========================= */

.header {
    position: relative;
    text-align: center;

    padding: 30px 20px;

    border-radius: 35px;

    background:
        linear-gradient(
            135deg,
            #ffffff,
            #fff1f8
        );

    border: 4px solid #ffffff;

    box-shadow:
        0 15px 35px rgba(150, 100, 160, 0.2);

    overflow: hidden;
}

.header::before {
    content: "✦ ✧ ✦ ✧ ✦";
    position: absolute;
    top: 10px;
    left: 0;
    right: 0;

    color: #f9a8d4;
    font-size: 22px;
}

.header::after {
    content: "🌸 🌷 🌸 🌷 🌸";
    position: absolute;
    bottom: 5px;
    left: 0;
    right: 0;

    font-size: 24px;
}

.bunny {
    display: inline-block;
    font-size: 85px;

    animation: bunnyBounce 2s ease-in-out infinite;
}

@keyframes bunnyBounce {
    0%, 100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-12px);
    }
}

.header h1 {
    margin: 5px 0;

    font-size: 38px;

    color: #ec4899;

    text-shadow:
        2px 2px 0 #fce7f3;
}

.header p {
    font-size: 17px;
    color: #8b5cf6;
}


/* =========================
   การ์ด
========================= */

.card {
    margin-top: 20px;

    padding: 25px;

    background:
        rgba(255,255,255,0.94);

    border-radius: 28px;

    border: 3px solid white;

    box-shadow:
        0 10px 30px rgba(150,100,160,0.15);
}

.card h2 {
    margin-top: 0;

    color: #db2777;
}


/* =========================
   สถิติ
========================= */

.stats {
    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 12px;

    margin-top: 20px;
}

.stat {
    padding: 18px 8px;

    text-align: center;

    border-radius: 22px;

    border: 3px solid white;

    box-shadow:
        0 7px 15px rgba(150,100,160,0.12);

    transition: 0.2s;
}

.stat:hover {
    transform: translateY(-6px) rotate(2deg);
}

.stat:nth-child(1) {
    background: #ffe4f1;
}

.stat:nth-child(2) {
    background: #e4ddff;
}

.stat:nth-child(3) {
    background: #dcfce7;
}

.stat-icon {
    font-size: 35px;
}

.number {
    font-size: 30px;
    font-weight: bold;
    margin: 5px;

    color: #db2777;
}


/* =========================
   Progress
========================= */

.progress-box {
    text-align: center;
}

.percent {
    font-size: 38px;
    font-weight: bold;
    color: #ec4899;
}

.progress {
    height: 30px;

    background: #f3e8ff;

    border-radius: 30px;

    border: 4px solid white;

    overflow: hidden;
}

.progress-bar {
    width: 0%;
    height: 100%;

    border-radius: 30px;

    background:
        linear-gradient(
            90deg,
            #f9a8d4,
            #c4b5fd,
            #93c5fd
        );

    transition: width 0.5s ease;
}


/* =========================
   ช่องกรอก
========================= */

label {
    display: block;

    margin-top: 10px;

    color: #be185d;

    font-weight: bold;
}

input {
    width: 100%;

    padding: 14px;

    margin-top: 7px;

    margin-bottom: 12px;

    border: 3px solid #fbcfe8;

    border-radius: 15px;

    background: #fffafd;

    font-size: 16px;

    outline: none;
}

input:focus {
    border-color: #c084fc;

    box-shadow:
        0 0 0 4px #ede9fe;
}


/* =========================
   ปุ่ม
========================= */

button {
    border: none;

    padding: 12px 17px;

    margin: 4px;

    border-radius: 14px;

    font-size: 15px;

    cursor: pointer;

    transition: 0.2s;
}

button:hover {
    transform: translateY(-3px) scale(1.03);
}

button:active {
    transform: scale(0.94);
}

.save {
    width: 100%;

    color: white;

    background:
        linear-gradient(
            135deg,
            #f472b6,
            #a78bfa
        );

    box-shadow:
        0 7px 15px rgba(236,72,153,0.25);
}

.done {
    background: #93c5fd;
    color: white;
}

.edit {
    background: #fde68a;
    color: #854d0e;
}

.delete {
    background: #fca5a5;
    color: white;
}


/* =========================
   งานแต่ละอัน
========================= */

.task {
    position: relative;

    padding: 20px;

    margin: 15px 0;

    border-radius: 22px;

    background: #fffaff;

    border: 3px solid #fce7f3;

    box-shadow:
        0 7px 18px rgba(150,100,160,0.1);

    transition: 0.2s;
}

.task:hover {
    transform: translateX(6px);
}

.task::after {
    content: "🌸";

    position: absolute;

    top: 10px;
    right: 15px;

    font-size: 25px;
}

.task h3 {
    color: #db2777;
}

.completed {
    opacity: 0.55;

    background: #f0fdf4;

    border-color: #bbf7d0;
}


/* =========================
   ปฏิทิน
========================= */

.calendar-head {
    display: flex;

    justify-content: space-between;

    align-items: center;
}

.calendar-head button {
    background: #fce7f3;
    color: #be185d;
}

.calendar-title {
    font-size: 22px;
    font-weight: bold;
    color: #db2777;
}

.weekdays,
.calendar-grid {
    display: grid;

    grid-template-columns:
        repeat(7, 1fr);

    gap: 5px;
}

.weekday {
    text-align: center;

    padding: 8px;

    font-weight: bold;

    color: #be185d;
}

.day {
    min-height: 70px;

    padding: 8px;

    border-radius: 13px;

    background: #fff7fb;

    cursor: pointer;

    border: 2px solid transparent;

    transition: 0.2s;
}

.day:hover {
    transform: scale(1.05);

    background: #fce7f3;
}

.today {
    border-color: #f472b6;

    background: #fdf2f8;
}

.task-dot {
    margin-top: 5px;

    font-size: 10px;

    color: #ec4899;

    white-space: nowrap;

    overflow: hidden;
}

.selected-info {
    margin-top: 15px;

    padding: 15px;

    border-radius: 15px;

    background: #fff7fb;

    border: 2px dashed #f9a8d4;
}


/* =========================
   ค้นหา
========================= */

.search {
    font-size: 16px;
}


/* =========================
   Footer
========================= */

.footer {
    text-align: center;

    padding: 30px;

    font-size: 25px;
}


/* =========================
   มือถือ
========================= */

@media (max-width: 600px) {

    .container {
        width: 95%;
        margin: 15px auto;
    }

    .header h1 {
        font-size: 28px;
    }

    .bunny {
        font-size: 65px;
    }

    .stats {
        gap: 6px;
    }

    .stat {
        padding: 12px 4px;
    }

    .number {
        font-size: 23px;
    }

    .day {
        min-height: 55px;
        font-size: 12px;
    }

    .cloud {
        font-size: 45px;
    }

}

</style>
</head>


<body>


<!-- =========================
     ตกแต่งพื้นหลัง
========================= -->

<div class="background">

    <div class="cloud cloud1">☁️</div>
    <div class="cloud cloud2">☁️</div>

    <div class="flower flower1">🌸</div>
    <div class="flower flower2">🌷</div>
    <div class="flower flower3">🌼</div>

    <div class="heart heart1">💗</div>
    <div class="heart heart2">💖</div>
    <div class="heart heart3">💕</div>

    <div class="star star1">✨</div>
    <div class="star star2">⭐</div>
    <div class="star star3">✦</div>

</div>


<div class="container">


<!-- =========================
     HEADER
========================= -->

<div class="header">

    <div class="bunny">
        🐰
    </div>

    <h1>
        🎀 My Cute Task 🎀
    </h1>

    <p>
        ✨ สมุดจดงานของคุณ ✨
    </p>

</div>


<!-- =========================
     STATS
========================= -->

<div class="stats">

    <div class="stat">

        <div class="stat-icon">
            📝
        </div>

        <div
            class="number"
            id="total"
        >
            0
        </div>

        <div>
            งานทั้งหมด
        </div>

    </div>


    <div class="stat">

        <div class="stat-icon">
            ⏰
        </div>

        <div
            class="number"
            id="remaining"
        >
            0
        </div>

        <div>
            งานค้าง
        </div>

    </div>


    <div class="stat">

        <div class="stat-icon">
            🌟
        </div>

        <div
            class="number"
            id="done"
        >
            0
        </div>

        <div>
            เสร็จแล้ว
        </div>

    </div>

</div>


<!-- =========================
     PROGRESS
========================= -->

<div class="card progress-box">

    <h2>
        🌈 ความคืบหน้าของฉัน
    </h2>

    <div
        class="percent"
        id="percent"
    >
        0%
    </div>

    <div class="progress">

        <div
            class="progress-bar"
            id="progressBar"
        ></div>

    </div>

    <p id="message">
        🌱 มาเริ่มกันเลย!
    </p>

</div>


<!-- =========================
     ADD TASK
========================= -->

<div class="card">

    <h2>
        🌸 เพิ่มงานใหม่
    </h2>

    <label>
        📚 วิชา
    </label>

    <input
        id="subject"
        type="text"
        placeholder="เช่น คณิตศาสตร์"
    >


    <label>
        📝 ชื่องาน
    </label>

    <input
        id="task"
        type="text"
        placeholder="เช่น แบบฝึกหัดบทที่ 3"
    >


    <label>
        📅 วันส่ง
    </label>

    <input
        id="date"
        type="date"
    >


    <label>
        ⏰ เวลาส่ง
    </label>

    <input
        id="time"
        type="time"
    >


    <button
        class="save"
        onclick="addTask()"
    >
        💖 เพิ่มงานลงสมุด
    </button>

</div>


<!-- =========================
     CALENDAR
========================= -->

<div class="card">

    <h2>
        📅 ปฏิทินของฉัน
    </h2>


    <div class="calendar-head">

        <button
            onclick="changeMonth(-1)"
        >
            ◀
        </button>

        <div
            id="calendarTitle"
            class="calendar-title"
        ></div>

        <button
            onclick="changeMonth(1)"
        >
            ▶
        </button>

    </div>


    <br>


    <div class="weekdays">

        <div class="weekday">อา</div>
        <div class="weekday">จ</div>
        <div class="weekday">อ</div>
        <div class="weekday">พ</div>
        <div class="weekday">พฤ</div>
        <div class="weekday">ศ</div>
        <div class="weekday">ส</div>

    </div>


    <div
        id="calendar"
        class="calendar-grid"
    ></div>


    <div
        id="selectedInfo"
        class="selected-info"
    >
        💭 กดวันที่เพื่อดูงาน
    </div>

</div>


<!-- =========================
     SEARCH
========================= -->

<div class="card">

    <h2>
        🔎 ค้นหางาน
    </h2>

    <input
        class="search"
        id="search"
        type="text"
        placeholder="🔍 ค้นหาวิชา หรือชื่องาน..."
        oninput="showTasks()"
    >

</div>


<!-- =========================
     TASK LIST
========================= -->

<h2 style="color:#db2777;">
    🎀 งานของฉัน
</h2>


<div id="taskList"></div>


<div class="footer">
    🐰 🌸 💗 ✨ 🌷 💖
</div>


</div>


<script>


/* =========================
   DATA
========================= */

let tasks =
    JSON.parse(
        localStorage.getItem("tasks")
    ) || [];


let calendarDate =
    new Date();


/* =========================
   SAVE
========================= */

function saveTasks() {

    localStorage.setItem(
        "tasks",
        JSON.stringify(tasks)
    );

}


/* =========================
   ADD TASK
========================= */

function addTask() {

    const subject =
        document
        .getElementById("subject")
        .value
        .trim();


    const task =
        document
        .getElementById("task")
        .value
        .trim();


    const date =
        document
        .getElementById("date")
        .value;


    const time =
        document
        .getElementById("time")
        .value;


    if (
        subject === "" ||
        task === "" ||
        date === "" ||
        time === ""
    ) {

        alert(
            "🌸 กรุณากรอกข้อมูลให้ครบก่อนนะ!"
        );

        return;
    }


    tasks.push({

        subject: subject,

        task: task,

        date: date,

        time: time,

        completed: false

    });


    saveTasks();

    showTasks();

    updateStats();

    drawCalendar();


    document
        .getElementById("subject")
        .value = "";


    document
        .getElementById("task")
        .value = "";


    document
        .getElementById("date")
        .value = "";


    document
        .getElementById("time")
        .value = "";


    alert(
        "💖 เพิ่มงานเรียบร้อยแล้ว!"
    );

}


/* =========================
   SHOW TASK
========================= */

function showTasks() {

    const list =
        document.getElementById(
            "taskList"
        );


    const search =
        document.getElementById(
            "search"
        )
        .value
        .toLowerCase();


    list.innerHTML = "";


    const filtered =
        tasks.filter(function(item) {

            return (

                item.subject
                    .toLowerCase()
                    .includes(search)

                ||

                item.task
                    .toLowerCase()
                    .includes(search)

            );

        });


    if (
        filtered.length === 0
    ) {

        list.innerHTML = `

            <div class="card"
                 style="text-align:center;">

                🐰

                <br><br>

                ยังไม่มีงานเลย~

                <br>

                เพิ่มงานแรกของคุณกันเถอะ 💗

            </div>

        `;

        return;
    }


    filtered.forEach(
        function(item) {

            const index =
                tasks.indexOf(item);


            const completed =
                item.completed
                ? "completed"
                : "";


            list.innerHTML += `

                <div
                    class="task ${completed}"
                >

                    <h3>
                        ${
                            item.completed
                            ? "🌟"
                            : "🌸"
                        }

                        ${item.subject}
                    </h3>


                    <p>
                        📝 ${item.task}
                    </p>


                    <p>
                        📅 ${item.date}
                        <br>
                        ⏰ ${item.time}
                    </p>


                    ${
                        item.completed

                        ?

                        `
                        <p>
                            🎉 เยี่ยมมาก!
                            งานนี้เสร็จแล้ว 💖
                        </p>
                        `

                        :

                        `
                        <button
                            class="done"
                            onclick="completeTask(${index})"
                        >
                            ✨ ทำเสร็จแล้ว
                        </button>
                        `
                    }


                    <button
                        class="edit"
                        onclick="editTask(${index})"
                    >
                        🎀 แก้ไข
                    </button>


                    <button
                        class="delete"
                        onclick="deleteTask(${index})"
                    >
                        🗑️ ลบ
                    </button>

                </div>

            `;

        }
    );

}


/* =========================
   COMPLETE
========================= */

function completeTask(index) {

    tasks[index].completed = true;


    saveTasks();

    showTasks();

    updateStats();

    drawCalendar();


    alert(
        "🎉 เก่งมากกก! ทำงานเสร็จอีกหนึ่งงานแล้ว 💗"
    );

}


/* =========================
   DELETE
========================= */

function deleteTask(index) {

    if (
        confirm(
            "🗑️ ต้องการลบงานนี้จริง ๆ ไหม?"
        )
    ) {

        tasks.splice(index, 1);

        saveTasks();

        showTasks();

        updateStats();

        drawCalendar();

    }

}


/* =========================
   EDIT
========================= */

function editTask(index) {

    const item =
        tasks[index];


    const subject =
        prompt(
            "📚 วิชา",
            item.subject
        );


    if (subject === null) {
        return;
    }


    const task =
        prompt(
            "📝 ชื่องาน",
            item.task
        );


    if (task === null) {
        return;
    }


    const date =
        prompt(
            "📅 วันส่ง เช่น 2026-08-20",
            item.date
        );


    if (date === null) {
        return;
    }


    const time =
        prompt(
            "⏰ เวลาส่ง เช่น 18:00",
            item.time
        );


    if (time === null) {
        return;
    }


    tasks[index].subject =
        subject.trim();


    tasks[index].task =
        task.trim();


    tasks[index].date =
        date.trim();


    tasks[index].time =
        time.trim();


    saveTasks();

    showTasks();

    updateStats();

    drawCalendar();

}


/* =========================
   STATS
========================= */

function updateStats() {

    const total =
        tasks.length;


    const done =
        tasks.filter(
            function(item) {
                return item.completed;
            }
        ).length;


    const remaining =
        total - done;


    let percent = 0;


    if (total > 0) {

        percent =
            Math.round(
                (done / total) * 100
            );

    }


    document
        .getElementById("total")
        .innerText = total;


    document
        .getElementById("remaining")
        .innerText = remaining;


    document
        .getElementById("done")
        .innerText = done;


    document
        .getElementById("percent")
        .innerText =
            percent + "%";


    document
        .getElementById("progressBar")
        .style.width =
            percent + "%";


    const message =
        document.getElementById(
            "message"
        );


    if (total === 0) {

        message.innerText =
            "🌱 มาเริ่มทำงานกันเถอะ!";

    }

    else if (percent < 30) {

        message.innerText =
            "🌱 ค่อย ๆ ทำไปนะ เราทำได้!";

    }

    else if (percent < 70) {

        message.innerText =
            "🌸 เก่งมาก! กำลังไปได้สวย!";

    }

    else if (percent < 100) {

        message.innerText =
            "✨ ใกล้เสร็จแล้ว สู้ต่ออีกนิด!";

    }

    else {

        message.innerText =
            "🎉 เยี่ยมที่สุด! งานเสร็จหมดแล้ว! 💖";

    }

}


/* =========================
   CALENDAR
========================= */

const months = [

    "มกราคม",
    "กุมภาพันธ์",
    "มีนาคม",
    "เมษายน",
    "พฤษภาคม",
    "มิถุนายน",
    "กรกฎาคม",
    "สิงหาคม",
    "กันยายน",
    "ตุลาคม",
    "พฤศจิกายน",
    "ธันวาคม"

];


function makeDate(
    year,
    month,
    day
) {

    return (

        year +
        "-" +
        String(month + 1)
            .padStart(2, "0") +
        "-" +
        String(day)
            .padStart(2, "0")

    );

}


function drawCalendar() {

    const calendar =
        document.getElementById(
            "calendar"
        );


    const title =
        document.getElementById(
            "calendarTitle"
        );


    const year =
        calendarDate.getFullYear();


    const month =
        calendarDate.getMonth();


    title.innerText =
        months[month] +
        " " +
        (year + 543);


    calendar.innerHTML = "";


    const firstDay =
        new Date(
            year,
            month,
            1
        ).getDay();


    const days =
        new Date(
            year,
            month + 1,
            0
        ).getDate();


    for (
        let i = 0;
        i < firstDay;
        i++
    ) {

        calendar.innerHTML +=
            "<div></div>";

    }


    const today =
        new Date();


    for (
        let day = 1;
        day <= days;
        day++
    ) {

        const date =
            makeDate(
                year,
                month,
                day
            );


        const dayTasks =
            tasks.filter(
                function(item) {
                    return item.date === date;
                }
            );


        let todayClass = "";


        if (

            today.getFullYear() === year &&

            today.getMonth() === month &&

            today.getDate() === day

        ) {

            todayClass = "today";

        }


        let taskText = "";


        dayTasks
            .slice(0, 2)
            .forEach(
                function(item) {

                    taskText += `

                        <div class="task-dot">
                            🌸 ${item.subject}
                        </div>

                    `;

                }
            );


        if (dayTasks.length > 2) {

            taskText += `

                <div class="task-dot">
                    +${dayTasks.length - 2} งาน
                </div>

            `;

        }


        calendar.innerHTML += `

            <div
                class="day ${todayClass}"
                onclick="selectDate('${date}')"
            >

                <strong>
                    ${day}
                </strong>

                ${taskText}

            </div>

        `;

    }

}


/* =========================
   CHANGE MONTH
========================= */

function changeMonth(amount) {

    calendarDate.setMonth(
        calendarDate.getMonth() + amount
    );


    drawCalendar();

}


/* =========================
   SELECT DATE
========================= */

function selectDate(date) {

    const box =
        document.getElementById(
            "selectedInfo"
        );


    const dayTasks =
        tasks.filter(
            function(item) {
                return item.date === date;
            }
        );


    if (
        dayTasks.length === 0
    ) {

        box.innerHTML = `

            🌷 ${date}

            <br><br>

            📭 วันนี้ไม่มีงานครับ

        `;

        return;
    }


    let html = `

        <strong>
            🌸 งานวันที่ ${date}
        </strong>

        <br><br>

    `;


    dayTasks.forEach(
        function(item) {

            html += `

                <div
                    style="
                        padding:12px;
                        margin:6px 0;
                        background:white;
                        border-radius:12px;
                        border:2px solid #fce7f3;
                    "
                >

                    ${
                        item.completed
                        ? "🌟"
                        : "📌"
                    }

                    <strong>
                        ${item.subject}
                    </strong>

                    <br>

                    📝 ${item.task}

                    <br>

                    ⏰ ${item.time}

                </div>

            `;

        }
    );


    box.innerHTML = html;

}

showTasks();

drawCalendar();
