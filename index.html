<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Cute Task 🐰</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    color: #5b5368;

    background:
        linear-gradient(
            135deg,
            #ffdff0,
            #e8ddff,
            #dff5ff
        );

    overflow-x: hidden;

    transition: 0.5s;
}


/* =========================
   พื้นหลังตกแต่ง
========================= */

.background {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 0;
}

.cloud {
    position: absolute;
    font-size: 65px;
    opacity: .75;
    animation: float 5s ease-in-out infinite;
}

.cloud1 {
    top: 40px;
    left: 3%;
}

.cloud2 {
    top: 130px;
    right: 4%;
    animation-delay: 2s;
}

.flower {
    position: absolute;
    font-size: 40px;
    animation: float 4s ease-in-out infinite;
}

.flower1 {
    top: 35%;
    left: 2%;
}

.flower2 {
    top: 65%;
    right: 3%;
    animation-delay: 1s;
}

.flower3 {
    bottom: 8%;
    left: 6%;
    animation-delay: 2s;
}

.star {
    position: absolute;
    font-size: 28px;
    animation: sparkle 2s infinite;
}

.star1 {
    top: 18%;
    left: 30%;
}

.star2 {
    top: 28%;
    right: 28%;
    animation-delay: 1s;
}

.star3 {
    bottom: 20%;
    left: 25%;
    animation-delay: .5s;
}

.heart {
    position: absolute;
    font-size: 27px;
    animation: float 5s ease-in-out infinite;
}

.heart1 {
    top: 25%;
    left: 15%;
}

.heart2 {
    top: 45%;
    right: 12%;
    animation-delay: 2s;
}

@keyframes float {

    0%,100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-15px);
    }

}

@keyframes sparkle {

    0%,100% {
        opacity: .3;
        transform: scale(.8);
    }

    50% {
        opacity: 1;
        transform: scale(1.3);
    }

}


/* =========================
   Container
========================= */

.container {
    width: 92%;
    max-width: 900px;
    margin: 25px auto;
    position: relative;
    z-index: 1;
}


/* =========================
   Header
========================= */

.header {

    position: relative;

    text-align: center;

    padding: 30px 20px;

    background:
        rgba(255,255,255,.92);

    border-radius: 35px;

    border: 4px solid white;

    box-shadow:
        0 15px 35px
        rgba(130,90,150,.2);

    overflow: hidden;

}

.header h1 {

    margin: 5px;

    color: #ec4899;

    font-size: 38px;

    text-shadow:
        2px 2px #fce7f3;

}

.header p {

    color: #8b5cf6;

}

.bunny {

    font-size: 80px;

    display: inline-block;

    animation:
        bunnyBounce 2s infinite;

}

@keyframes bunnyBounce {

    0%,100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-12px);
    }

}


/* =========================
   Dark mode button
========================= */

.mode-button {

    position: absolute;

    top: 15px;
    right: 15px;

    background: #fce7f3;

    font-size: 22px;

}


/* =========================
   Stats
========================= */

.stats {

    display: grid;

    grid-template-columns:
        repeat(3,1fr);

    gap: 12px;

    margin-top: 20px;

}

.stat {

    padding: 18px 8px;

    text-align: center;

    border-radius: 22px;

    border: 3px solid white;

    box-shadow:
        0 7px 15px
        rgba(120,80,150,.12);

    transition: .25s;

}

.stat:hover {

    transform:
        translateY(-6px)
        rotate(2deg);

}

.stat:nth-child(1) {
    background: #ffe4f1;
}

.stat:nth-child(2) {
    background: #e8e0ff;
}

.stat:nth-child(3) {
    background: #dcfce7;
}

.stat-icon {

    font-size: 35px;

}

.number {

    font-size: 30px;

    font-weight: bold;

    color: #db2777;

}


/* =========================
   Card
========================= */

.card {

    margin-top: 20px;

    padding: 25px;

    background:
        rgba(255,255,255,.94);

    border-radius: 28px;

    border: 3px solid white;

    box-shadow:
        0 10px 30px
        rgba(120,80,150,.15);

}

.card h2 {

    margin-top: 0;

    color: #db2777;

}


/* =========================
   Progress
========================= */

.progress-box {

    text-align: center;

}

.percent {

    font-size: 40px;

    font-weight: bold;

    color: #ec4899;

}

.progress {

    height: 30px;

    background: #f3e8ff;

    border-radius: 30px;

    border: 4px solid white;

    overflow: hidden;

}

.progress-bar {

    width: 0%;

    height: 100%;

    border-radius: 30px;

    background:
        linear-gradient(
            90deg,
            #f9a8d4,
            #c4b5fd,
            #93c5fd
        );

    transition: .6s;

}


/* =========================
   Input
========================= */

label {

    display: block;

    margin-top: 10px;

    font-weight: bold;

    color: #be185d;

}

input {

    width: 100%;

    padding: 14px;

    margin-top: 7px;

    margin-bottom: 12px;

    border:
        3px solid #fbcfe8;

    border-radius: 15px;

    background: #fffafd;

    font-size: 16px;

    outline: none;

}

input:focus {

    border-color: #c084fc;

    box-shadow:
        0 0 0 4px #ede9fe;

}


/* =========================
   Buttons
========================= */

button {

    border: none;

    padding: 12px 17px;

    margin: 4px;

    border-radius: 14px;

    font-size: 15px;

    cursor: pointer;

    transition: .2s;

}

button:hover {

    transform:
        translateY(-3px)
        scale(1.03);

}

button:active {

    transform: scale(.94);

}

.save {

    width: 100%;

    color: white;

    background:
        linear-gradient(
            135deg,
            #f472b6,
            #a78bfa
        );

}

.done {

    background: #93c5fd;

    color: white;

}

.edit {

    background: #fde68a;

    color: #854d0e;

}

.delete {

    background: #fca5a5;

    color: white;

}


/* =========================
   Task
========================= */

.task {

    position: relative;

    padding: 20px;

    margin: 15px 0;

    border-radius: 22px;

    background: #fffaff;

    border:
        3px solid #fce7f3;

    box-shadow:
        0 7px 18px
        rgba(120,80,150,.1);

    transition: .25s;

}

.task:hover {

    transform:
        translateX(6px);

}

.task::after {

    content: "🌸";

    position: absolute;

    right: 15px;
    top: 10px;

    font-size: 25px;

}

.task h3 {

    color: #db2777;

}

.completed {

    opacity: .55;

    background: #f0fdf4;

    border-color: #bbf7d0;

}


/* =========================
   Calendar
========================= */

.calendar-head {

    display: flex;

    justify-content:
        space-between;

    align-items: center;

}

.calendar-head button {

    background: #fce7f3;

    color: #be185d;

}

.calendar-title {

    font-size: 22px;

    font-weight: bold;

    color: #db2777;

}

.weekdays,
.calendar-grid {

    display: grid;

    grid-template-columns:
        repeat(7,1fr);

    gap: 5px;

}

.weekday {

    text-align: center;

    padding: 8px;

    font-weight: bold;

    color: #be185d;

}

.day {

    min-height: 70px;

    padding: 8px;

    border-radius: 13px;

    background: #fff7fb;

    cursor: pointer;

    border: 2px solid transparent;

    transition: .2s;

}

.day:hover {

    transform: scale(1.05);

    background: #fce7f3;

}

.today {

    border-color: #f472b6;

    background: #fdf2f8;

}

.task-dot {

    margin-top: 5px;

    font-size: 10px;

    color: #ec4899;

    white-space: nowrap;

    overflow: hidden;

}

.selected-info {

    margin-top: 15px;

    padding: 15px;

    border-radius: 15px;

    background: #fff7fb;

    border:
        2px dashed #f9a8d4;

}


/* =========================
   Walking Bunny
========================= */

#walkingBunny {

    position: fixed;

    bottom: 10px;

    left: -80px;

    font-size: 55px;

    z-index: 9999;

    pointer-events: none;

    animation:
        bunnyWalk 18s linear infinite;

}

@keyframes bunnyWalk {

    0% {

        left: -80px;

        transform: scaleX(1);

    }

    45% {

        left: calc(100% - 60px);

        transform: scaleX(1);

    }

    50% {

        left: calc(100% - 60px);

        transform: scaleX(-1);

    }

    95% {

        left: -80px;

        transform: scaleX(-1);

    }

    100% {

        left: -80px;

        transform: scaleX(1);

    }

}


/* =========================
   Floating Hearts
========================= */

.floating-heart {

    position: fixed;

    pointer-events: none;

    z-index: 99999;

    font-size: 28px;

    animation:
        heartUp 1.5s ease-out forwards;

}

@keyframes heartUp {

    0% {

        opacity: 1;

        transform:
            translateY(0)
            scale(.5);

    }

    100% {

        opacity: 0;

        transform:
            translateY(-130px)
            scale(1.5);

    }

}


/* =========================
   Celebration
========================= */

.celebration {

    position: fixed;

    inset: 0;

    display: flex;

    justify-content: center;

    align-items: center;

    background:
        rgba(255,220,240,.75);

    z-index: 100000;

    pointer-events: none;

    animation:
        celebrationFade 2s forwards;

}

.celebration-box {

    padding: 35px;

    background: white;

    border-radius: 30px;

    text-align: center;

    box-shadow:
        0 15px 40px
        rgba(120,80,150,.25);

    animation:
        celebrationPop .5s;

}

.celebration-box div {

    font-size: 60px;

}

.celebration-box h2 {

    color: #ec4899;

}

@keyframes celebrationPop {

    from {

        transform: scale(.5);

    }

    to {

        transform: scale(1);

    }

}

@keyframes celebrationFade {

    0%,80% {

        opacity: 1;

    }

    100% {

        opacity: 0;

    }

}


/* =========================
   Dark Mode
========================= */

body.dark {

    background:
        linear-gradient(
            135deg,
            #24213b,
            #31244f,
            #172b3b
        );

    color: #eee;

}

body.dark .card,
body.dark .header {

    background:
        rgba(35,30,55,.95);

    color: #eee;

}

body.dark .task {

    background: #302941;

    border-color: #55426b;

}

body.dark .day {

    background: #302941;

}

body.dark .selected-info {

    background: #302941;

}

body.dark .mode-button {

    background: #55426b;

}


/* =========================
   Mobile
========================= */

@media (max-width:600px) {

    .container {

        width: 95%;

    }

    .header h1 {

        font-size: 28px;

    }

    .bunny {

        font-size: 65px;

    }

    .stats {

        gap: 6px;

    }

    .number {

        font-size: 23px;

    }

    .day {

        min-height: 55px;

        font-size: 12px;

    }

}

</style>
</head>


<body>


<!-- =========================
     Background
========================= -->

<div class="background">

    <div class="cloud cloud1">☁️</div>

    <div class="cloud cloud2">☁️</div>

    <div class="flower flower1">🌸</div>

    <div class="flower flower2">🌷</div>

    <div class="flower flower3">🌼</div>

    <div class="heart heart1">💗</div>

    <div class="heart heart2">💖</div>

    <div class="star star1">✨</div>

    <div class="star star2">⭐</div>

    <div class="star star3">✦</div>

</div>


<div class="container">


<!-- Header -->

<div class="header">

    <button
        class="mode-button"
        onclick="toggleDark()"
    >
        🌙
    </button>

    <div class="bunny">
        🐰
    </div>

    <h1>
        🎀 My Cute Task 🎀
    </h1>

    <p>
        ✨ สมุดจดงานแสนน่ารักของฉัน ✨
    </p>

</div>


<!-- Stats -->

<div class="stats">

    <div class="stat">

        <div class="stat-icon">
            📝
        </div>

        <div
            class="number"
            id="total"
        >
            0
        </div>

        งานทั้งหมด

    </div>


    <div class="stat">

        <div class="stat-icon">
            ⏰
        </div>

        <div
            class="number"
            id="remaining"
        >
            0
        </div>

        งานค้าง

    </div>


    <div class="stat">

        <div class="stat-icon">
            🌟
        </div>

        <div
            class="number"
            id="done"
        >
            0
        </div>

        เสร็จแล้ว

    </div>

</div>


<!-- Progress -->

<div class="card progress-box">

    <h2>
        🌈 ความคืบหน้าของฉัน
    </h2>

    <div
        class="percent"
        id="percent"
    >
        0%
    </div>

    <div class="progress">

        <div
            class="progress-bar"
            id="progressBar"
        ></div>

    </div>

    <p id="message">
        🌱 มาเริ่มกันเลย!
    </p>

</div>


<!-- Add -->

<div class="card">

    <h2>
        🌸 เพิ่มงานใหม่
    </h2>

    <label>
        📚 วิชา
    </label>

    <input
        id="subject"
        type="text"
        placeholder="เช่น คณิตศาสตร์"
    >


    <label>
        📝 ชื่องาน
    </label>

    <input
        id="task"
        type="text"
        placeholder="เช่น แบบฝึกหัดบทที่ 3"
    >


    <label>
        📅 วันส่ง
    </label>

    <input
        id="date"
        type="date"
    >


    <label>
        ⏰ เวลาส่ง
    </label>

    <input
        id="time"
        type="time"
    >


    <button
        class="save"
        onclick="addTask()"
    >
        💖 เพิ่มงานลงสมุด
    </button>

</div>


<!-- Calendar -->

<div class="card">

    <h2>
        📅 ปฏิทินของฉัน
    </h2>

    <div class="calendar-head">

        <button onclick="changeMonth(-1)">
            ◀
        </button>

        <div
            id="calendarTitle"
            class="calendar-title"
        ></div>

        <button onclick="changeMonth(1)">
            ▶
        </button>

    </div>

    <br>

    <div class="weekdays">

        <div class="weekday">อา</div>
        <div class="weekday">จ</div>
        <div class="weekday">อ</div>
        <div class="weekday">พ</div>
        <div class="weekday">พฤ</div>
        <div class="weekday">ศ</div>
        <div class="weekday">ส</div>

    </div>

    <div
        id="calendar"
        class="calendar-grid"
    ></div>

    <div
        id="selectedInfo"
        class="selected-info"
    >
        💭 กดวันที่เพื่อดูงาน
    </div>

</div>


<!-- Search -->

<div class="card">

    <h2>
        🔎 ค้นหางาน
    </h2>

    <input
        id="search"
        type="text"
        placeholder="🔍 ค้นหาวิชาหรือชื่องาน..."
        oninput="showTasks()"
    >

</div>


<h2 style="color:#db2777;">
    🎀 งานของฉัน
</h2>

<div id="taskList"></div>


<div
    style="
        text-align:center;
        padding:30px;
        font-size:28px;
    "
>
    🐰 🌸 💗 ✨ 🌷 💖
</div>


</div>


<!-- Walking Bunny -->

<div id="walkingBunny">
    🐰
</div>


<script>

/* =========================
   DATA
========================= */

let tasks =
    JSON.parse(
        localStorage.getItem("tasks")
    ) || [];


let calendarDate =
    new Date();


/* =========================
   SAVE
========================= */

function saveTasks() {

    localStorage.setItem(
        "tasks",
        JSON.stringify(tasks)
    );

}


/* =========================
   ADD
========================= */

function addTask() {

    const subject =
        document
        .getElementById("subject")
        .value
        .trim();

    const task =
        document
        .getElementById("task")
        .value
        .trim();

    const date =
        document
        .getElementById("date")
        .value;

    const time =
        document
        .getElementById("time")
        .value;


    if (
        !subject ||
        !task ||
        !date ||
        !time
    ) {

        alert(
            "🌸 กรุณากรอกข้อมูลให้ครบก่อนนะครับ"
        );

        return;

    }


    tasks.push({

        subject: subject,

        task: task,

        date: date,

        time: time,

        completed: false

    });


    saveTasks();

    showTasks();

    updateStats();

    drawCalendar();


    document.getElementById(
        "subject"
    ).value = "";

    document.getElementById(
        "task"
    ).value = "";

    document.getElementById(
        "date"
    ).value = "";

    document.getElementById(
        "time"
    ).value = "";


    createHearts(8);


    alert(
        "💖 เพิ่มงานเรียบร้อยแล้ว!"
    );

}


/* =========================
   SHOW TASK
========================= */

function showTasks() {

    const list =
        document.getElementById(
            "taskList"
        );


    const search =
        document
        .getElementById("search")
        .value
        .toLowerCase();


    list.innerHTML = "";


    const filtered =
        tasks.filter(
            function(item) {

                return (

                    item.subject
                    .toLowerCase()
                    .includes(search)

                    ||

                    item.task
                    .toLowerCase()
                    .includes(search)

                );

            }
        );


    if (!filtered.length) {

        list.innerHTML = `

            <div class="card"
                 style="text-align:center;">

                🐰

                <br><br>

                ยังไม่มีงานเลย~

                <br>

                เพิ่มงานแรกกันเถอะ 💗

            </div>

        `;

        return;

    }


    filtered.forEach(
        function(item) {

            const index =
                tasks.indexOf(item);


            const completed =
                item.completed
                ? "completed"
                : "";


            list.innerHTML += `

                <div class="task ${completed}">

                    <h3>
                        ${
                            item.completed
                            ? "🌟"
                            : "🌸"
                        }

                        ${item.subject}
                    </h3>

                    <p>
                        📝 ${item.task}
                    </p>

                    <p>
                        📅 ${item.date}
                        <br>
                        ⏰ ${item.time}
                    </p>


                    ${
                        item.completed

                        ?

                        `
                        <p>
                            🎉 เก่งมาก!
                            งานนี้เสร็จแล้ว 💖
                        </p>
                        `

                        :

                        `
                        <button
                            class="done"
                            onclick="completeTask(${index})"
                        >
                            ✨ ทำเสร็จแล้ว
                        </button>
                        `
                    }


                    <button
                        class="edit"
                        onclick="editTask(${index})"
                    >
                        🎀 แก้ไข
                    </button>


                    <button
                        class="delete"
                        onclick="deleteTask(${index})"
                    >
                        🗑️ ลบ
                    </button>

                </div>

            `;

        }
    );

}


/* =========================
   COMPLETE
========================= */

function completeTask(index) {

    tasks[index].completed = true;


    saveTasks();

    showTasks();

    updateStats();

    drawCalendar();


    createHearts(20);


    if (
        tasks.length > 0 &&
        tasks.every(
            function(item) {
                return item.completed;
            }
        )
    ) {

        celebrate();

    }

}


/* =========================
   DELETE
========================= */

function deleteTask(index) {

    if (
        confirm(
            "🗑️ ต้องการลบงานนี้ไหมครับ?"
        )
    ) {

        tasks.splice(index, 1);

        saveTasks();

        showTasks();

        updateStats();

        drawCalendar();

    }

}


/* =========================
   EDIT
========================= */

function editTask(index) {

    const item =
        tasks[index];


    const subject =
        prompt(
            "📚 วิชา",
            item.subject
        );

    if (subject === null) return;


    const task =
        prompt(
            "📝 ชื่องาน",
            item.task
        );

    if (task === null) return;


    const date =
        prompt(
            "📅 วันส่ง เช่น 2026-08-20",
            item.date
        );

    if (date === null) return;


    const time =
        prompt(
            "⏰ เวลา เช่น 18:00",
            item.time
        );

    if (time === null) return;


    tasks[index].subject =
        subject.trim();

    tasks[index].task =
        task.trim();

    tasks[index].date =
        date.trim();

    tasks[index].time =
        time.trim();


    saveTasks();

    showTasks();

    updateStats();

    drawCalendar();

}


/* =========================
   STATS
========================= */

function updateStats() {

    const total =
        tasks.length;


    const done =
        tasks.filter(
            function(item) {
                return item.completed;
            }
        ).length;


    const remaining =
        total - done;


    const percent =
        total === 0
        ? 0
        : Math.round(
            done / total * 100
        );


    document.getElementById(
        "total"
    ).innerText = total;


    document.getElementById(
        "remaining"
    ).innerText = remaining;


    document.getElementById(
        "done"
    ).innerText = done;


    document.getElementById(
        "percent"
    ).innerText =
        percent + "%";


    document.getElementById(
        "progressBar"
    ).style.width =
        percent + "%";


    const message =
        document.getElementById(
            "message"
        );


    if (total === 0) {

        message.innerText =
            "🌱 มาเริ่มกันเลย!";

    }
    else if (percent < 30) {

        message.innerText =
            "🌱 ค่อย ๆ ทำไปนะ เราทำได้!";

    }
    else if (percent < 70) {

        message.innerText =
            "🌸 เก่งมาก! กำลังไปได้สวย!";

    }
    else if (percent < 100) {

        message.innerText =
            "✨ ใกล้เสร็จแล้ว สู้ต่ออีกนิด!";

    }
    else {

        message.innerText =
            "🎉 งานเสร็จหมดแล้ว! เก่งที่สุด!";

    }

}


/* =========================
   CALENDAR
========================= */

const months = [

    "มกราคม",
    "กุมภาพันธ์",
    "มีนาคม",
    "เมษายน",
    "พฤษภาคม",
    "มิถุนายน",
    "กรกฎาคม",
    "สิงหาคม",
    "กันยายน",
    "ตุลาคม",
    "พฤศจิกายน",
    "ธันวาคม"

];


function makeDate(
    year,
    month,
    day
) {

    return (

        year +
        "-" +
        String(month + 1)
            .padStart(2,"0") +
        "-" +
        String(day)
            .padStart(2,"0")

    );

}


function drawCalendar() {

    const calendar =
        document.getElementById(
            "calendar"
        );


    const title =
        document.getElementById(
            "calendarTitle"
        );


    const year =
        calendarDate.getFullYear();


    const month =
        calendarDate.getMonth();


    title.innerText =
        months[month] +
        " " +
        (year + 543);


    calendar.innerHTML = "";


    const firstDay =
        new Date(
            year,
            month,
            1
        ).getDay();


    const days =
        new Date(
            year,
            month + 1,
            0
        ).getDate();


    for (
        let i = 0;
        i < firstDay;
        i++
    ) {

        calendar.innerHTML +=
            "<div></div>";

    }


    const today =
        new Date();


    for (
        let day = 1;
        day <= days;
        day++
    ) {

        const date =
            makeDate(
                year,
                month,
                day
            );


        const dayTasks =
            tasks.filter(
                function(item) {
                    return item.date === date;
                }
            );


        let todayClass = "";


        if (

            today.getFullYear() === year &&

            today.getMonth() === month &&

            today.getDate() === day

        ) {

            todayClass = "today";

        }


        let dots = "";


        dayTasks
        .slice(0,2)
        .forEach(
            function(item) {

                dots += `

                    <div class="task-dot">
                        🌸 ${item.subject}
                    </div>

                `;

            }
        );


        if (dayTasks.length > 2) {

            dots += `

                <div class="task-dot">
                    +${dayTasks.length - 2} งาน
                </div>

            `;

        }


        calendar.innerHTML += `

            <div
                class="day ${todayClass}"
                onclick="selectDate('${date}')"
            >

                <strong>
                    ${day}
                </strong>

                ${dots}

            </div>

        `;

    }

}


/* =========================
   MONTH
========================= */

function changeMonth(amount) {

    calendarDate.setMonth(
        calendarDate.getMonth() + amount
    );


    drawCalendar();

}


/* =========================
   DATE
========================= */

function selectDate(date) {

    const box =
        document.getElementById(
            "selectedInfo"
        );


    const dayTasks =
        tasks.filter(
            function(item) {
                return item.date === date;
            }
        );


    if (!dayTasks.length) {

        box.innerHTML = `

            🌷 ${date}

            <br><br>

            📭 วันนี้ไม่มีงานครับ

        `;

        return;

    }


    let html = `

        <strong>
            🌸 งานวันที่ ${date}
        </strong>

        <br><br>

    `;


    dayTasks.forEach(
        function(item) {

            html += `

                <div
                    style="
                        padding:12px;
                        margin:6px 0;
                        background:white;
                        border-radius:12px;
                    "
                >

                    ${
                        item.completed
                        ? "🌟"
                        : "📌"
                    }

                    <strong>
                        ${item.subject}
                    </strong>

                    <br>

                    📝 ${item.task}

                    <br>

                    ⏰ ${item.time}

                </div>

            `;

        }
    );


    box.innerHTML = html;

}


/* =========================
   HEART EFFECT
========================= */

function createHearts(amount) {

    for (
        let i = 0;
        i < amount;
        i++
    ) {

        setTimeout(
            function() {

                const heart =
                    document.createElement(
                        "div"
                    );


                heart.className =
                    "floating-heart";


                const emojis = [
                    "💗",
                    "💖",
                    "💕",
                    "✨",
                    "🌸",
                    "⭐"
                    "🐽"
                ];


                heart.innerText =
                    emojis[
                        Math.floor(
                            Math.random()
                            * emojis.length
                        )
                    ];


                heart.style.left =
                    (
                        10 +
                        Math.random() * 80
                    ) + "%";


                heart.style.bottom =
                    (
                        80 +
                        Math.random() * 120
                    ) + "px";


                document.body.appendChild(
                    heart
                );


                setTimeout(
                    function() {

                        heart.remove();

                    },
                    1500
                );

            },
            i * 60
        );

    }

}

function toggleDark() {

    document.body.classList.toggle(
        "dark"
    );


    const button =
        document.querySelector(
            ".mode-button"
        );


    if (
        document.body.classList.contains(
            "dark"
        )
    ) {

        button.innerText = "☀️";

    }
    else {

        button.innerText = "🌙";

    }

}
