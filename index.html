<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ระบบจัดการงาน</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #dbeafe, #fce7f3);
    min-height: 100vh;
    padding: 20px;
}

.container {
    max-width: 700px;
    margin: auto;
}

.header {
    text-align: center;
    margin-bottom: 20px;
}

.header h1 {
    margin-bottom: 5px;
}

.header p {
    color: #666;
}

.box,
.task,
.stats {
    background: white;
    padding: 20px;
    margin-bottom: 15px;
    border-radius: 18px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.08);
}

h2 {
    margin-top: 0;
}

label {
    font-weight: bold;
}

input {
    width: 100%;
    padding: 12px;
    margin: 7px 0 15px;
    border: 1px solid #ddd;
    border-radius: 10px;
    font-size: 16px;
}

button {
    padding: 11px 16px;
    margin: 4px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-size: 15px;
}

.save {
    background: #22c55e;
    color: white;
    width: 100%;
}

.done {
    background: #3b82f6;
    color: white;
}

.delete {
    background: #ef4444;
    color: white;
}

.stats {
    display: flex;
    justify-content: space-around;
    text-align: center;
}

.stat-number {
    font-size: 28px;
    font-weight: bold;
}

.task h3 {
    margin-top: 0;
}

.completed {
    text-decoration: line-through;
    opacity: 0.5;
}

.empty {
    text-align: center;
    color: #777;
    padding: 20px;
}

</style>
</head>

<body>

<div class="container">

    <div class="header">

        <h1>📚 ระบบจัดการงาน</h1>

        <p>
            ช่วยจัดการงานและกำหนดส่งของคุณ
        </p>

    </div>


    <div class="stats">

        <div>
            <div class="stat-number" id="total">0</div>
            <div>งานทั้งหมด</div>
        </div>

        <div>
            <div class="stat-number" id="completed">0</div>
            <div>เสร็จแล้ว</div>
        </div>

        <div>
            <div class="stat-number" id="remaining">0</div>
            <div>ค้างอยู่</div>
        </div>

    </div>


    <div class="box">

        <h2>➕ เพิ่มงานใหม่</h2>

        <label>วิชา</label>

        <input
            id="subject"
            type="text"
            placeholder="เช่น คณิตศาสตร์"
        >


        <label>ชื่องาน</label>

        <input
            id="task"
            type="text"
            placeholder="เช่น แบบฝึกหัดบทที่ 3"
        >


        <label>วันส่ง</label>

        <input
            id="date"
            type="date"
        >


        <label>เวลาส่ง</label>

        <input
            id="time"
            type="time"
        >


        <button
            class="save"
            onclick="addTask()"
        >
            💾 บันทึกงาน
        </button>

    </div>


    <h2>📋 งานของฉัน</h2>

    <div id="taskList"></div>

</div>


<script>

let tasks =
    JSON.parse(
        localStorage.getItem("tasks")
    ) || [];


function addTask() {

    let subject =
        document.getElementById("subject").value;

    let task =
        document.getElementById("task").value;

    let date =
        document.getElementById("date").value;

    let time =
        document.getElementById("time").value;


    if (
        subject === "" ||
        task === "" ||
        date === "" ||
        time === ""
    ) {

        alert("กรุณากรอกข้อมูลให้ครบ");

        return;
    }


    let newTask = {

        subject: subject,

        task: task,

        date: date,

        time: time,

        completed: false,

        notified: false

    };


    tasks.push(newTask);


    localStorage.setItem(
        "tasks",
        JSON.stringify(tasks)
    );


    showTasks();


    document.getElementById("subject").value = "";

    document.getElementById("task").value = "";

    document.getElementById("date").value = "";

    document.getElementById("time").value = "";

}


function showTasks() {

    let list =
        document.getElementById("taskList");


    list.innerHTML = "";


    updateStats();


    if (tasks.length === 0) {

        list.innerHTML =
            '<div class="empty">📭 ยังไม่มีงาน</div>';

        return;

    }


    tasks.forEach(function(item, index) {

        let completedClass =
            item.completed
            ? "completed"
            : "";


        list.innerHTML += `

            <div class="task ${completedClass}">

                <h3>
                    📚 ${item.subject}
                </h3>

                <p>
                    📝 ${item.task}
                </p>

                <p>
                    📅 วันที่ส่ง: ${item.date}
                    <br>
                    ⏰ เวลา: ${item.time}
                </p>


                ${
                    item.completed
                    ? "<p>✅ ทำงานเสร็จแล้ว</p>"
                    : `
                        <button
                            class="done"
                            onclick="completeTask(${index})"
                        >
                            ✅ ทำเสร็จแล้ว
                        </button>
                    `
                }


                <button
                    class="delete"
                    onclick="deleteTask(${index})"
                >
                    🗑️ ลบ
                </button>

            </div>

        `;

    });

}


function completeTask(index) {

    tasks[index].completed = true;


    localStorage.setItem(
        "tasks",
        JSON.stringify(tasks)
    );


    showTasks();

}


function deleteTask(index) {

    if (
        confirm("ต้องการลบงานนี้หรือไม่?")
    ) {

        tasks.splice(index, 1);


        localStorage.setItem(
            "tasks",
            JSON.stringify(tasks)
        );


        showTasks();

    }

}


function updateStats() {

    let total =
        tasks.length;


    let completed =
        tasks.filter(
            item => item.completed
        ).length;


    let remaining =
        total - completed;


    document.getElementById("total")
        .innerText = total;


    document.getElementById("completed")
        .innerText = completed;


    document.getElementById("remaining")
        .innerText = remaining;

}


function checkDeadline() {

    let now =
        new Date();


    tasks.forEach(function(item) {

        if (item.completed) {
            return;
        }


        let deadline =
            new Date(
                item.date +
                "T" +
                item.time
            );


        let difference =
            deadline - now;


        if (
            difference > 0 &&
            difference <=
            60 * 60 * 1000 &&
            !item.notified
        ) {

            alert(
                "🔔 ใกล้ถึงกำหนดส่ง!\n\n" +
                item.subject +
                "\n" +
                item.task
            );


            item.notified = true;


            localStorage.setItem(
                "tasks",
                JSON.stringify(tasks)
            );

        }

    });

}


setInterval(
    checkDeadline,
    60000
);


showTasks();

</script>

</body>
</html>
