<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ระบบจัดการงาน</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #dbeafe, #fce7f3);
    min-height: 100vh;
    padding: 20px;
}

.container {
    max-width: 850px;
    margin: auto;
}

.header {
    text-align: center;
    margin-bottom: 20px;
}

.header h1 {
    margin-bottom: 5px;
}

.header p {
    color: #666;
}


/* กล่อง */

.box,
.card,
.task,
.calendar {
    background: white;
    padding: 20px;
    margin-bottom: 15px;
    border-radius: 18px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.08);
}


/* Dashboard */

.dashboard {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    margin-bottom: 15px;
}

.card {
    margin: 0;
}

.card-title {
    color: #666;
    font-size: 14px;
}

.card-number {
    font-size: 30px;
    font-weight: bold;
    margin-top: 5px;
}

.card-icon {
    font-size: 28px;
}


/* progress */

.progress-box {
    margin-top: 12px;
}

.progress {
    height: 12px;
    background: #e5e7eb;
    border-radius: 20px;
    overflow: hidden;
}

.progress-bar {
    height: 100%;
    width: 0%;
    background: #22c55e;
    transition: 0.3s;
}


/* input */

label {
    font-weight: bold;
}

input {
    width: 100%;
    padding: 12px;
    margin: 7px 0 15px;
    border: 1px solid #ddd;
    border-radius: 10px;
    font-size: 16px;
}


/* buttons */

button {
    padding: 11px 16px;
    margin: 4px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-size: 15px;
}

.save {
    background: #22c55e;
    color: white;
    width: 100%;
}

.done {
    background: #3b82f6;
    color: white;
}

.edit {
    background: #f59e0b;
    color: white;
}

.delete {
    background: #ef4444;
    color: white;
}

.notify {
    background: #8b5cf6;
    color: white;
    width: 100%;
    margin-top: 10px;
}

.filter {
    background: #e5e7eb;
    color: #333;
}

.filter.active {
    background: #111827;
    color: white;
}


/* งานใกล้ส่ง */

.urgent {
    border-left: 6px solid #ef4444;
}

.urgent h3 {
    margin-top: 0;
}

.no-urgent {
    text-align: center;
    color: #777;
    padding: 15px;
}


/* งาน */

.task h3 {
    margin-top: 0;
}

.completed {
    text-decoration: line-through;
    opacity: 0.5;
}

.task.today {
    border-left: 6px solid #ef4444;
}

.task.soon {
    border-left: 6px solid #f59e0b;
}


/* badge */

.badge {
    display: inline-block;
    padding: 5px 9px;
    border-radius: 8px;
    font-size: 13px;
    margin-bottom: 8px;
}

.badge-today {
    background: #fee2e2;
    color: #b91c1c;
}

.badge-soon {
    background: #fef3c7;
    color: #92400e;
}

.badge-normal {
    background: #dcfce7;
    color: #166
