<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>My Cute Task 🐰</title>

<meta name="theme-color" content="#f9a8d4">
<link rel="manifest" href="./manifest.json">

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    color:#5b5368;
    background:linear-gradient(135deg,#ffdff0,#e8ddff,#dff5ff);
}

.container{
    width:94%;
    max-width:850px;
    margin:20px auto;
}

.header,.card{
    background:#ffffffee;
    border:3px solid white;
    border-radius:25px;
    padding:20px;
    margin-bottom:18px;
    box-shadow:0 8px 25px #80608025;
}

.header{
    text-align:center;
    position:relative;
}

.bunny{
    font-size:70px;
}

h1{color:#ec4899}
h2{color:#db2777}

input,select{
    width:100%;
    padding:13px;
    margin:6px 0 12px;
    border:3px solid #fbcfe8;
    border-radius:14px;
    font-size:16px;
}

button{
    border:0;
    padding:12px 16px;
    margin:4px;
    border-radius:14px;
    font-size:15px;
    cursor:pointer;
}

.save,.notify{
    width:100%;
    color:white;
    background:linear-gradient(135deg,#f472b6,#a78bfa);
}

.done{background:#93c5fd;color:white}
.delete{background:#fca5a5;color:white}

.task{
    background:#fffaff;
    border:3px solid #fce7f3;
    border-radius:20px;
    padding:18px;
    margin:12px 0;
}

.completed{
    opacity:.55;
    text-decoration:line-through;
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
}

.stat{
    text-align:center;
    padding:15px 5px;
    border-radius:18px;
    background:white;
}

.number{
    font-size:28px;
    font-weight:bold;
    color:#db2777;
}

.progress{
    height:25px;
    background:#f3e8ff;
    border-radius:20px;
    overflow:hidden;
}

.progress-bar{
    height:100%;
    width:0;
    background:linear-gradient(90deg,#f9a8d4,#c4b5fd,#93c5fd);
}

.percent{
    text-align:center;
    font-size:35px;
    color:#ec4899;
    font-weight:bold;
}

.calendar-grid{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:5px;
}

.day{
    min-height:55px;
    padding:6px;
    border-radius:12px;
    background:#fff7fb;
    font-size:12px;
}

.today{
    border:2px solid #f472b6;
}

.task-dot{
    color:#ec4899;
    overflow:hidden;
    white-space:nowrap;
}

@media(max-width:600px){
    .number{font-size:22px}
}
</style>
</head>

<body>

<div class="container">

<div class="header">
    <div class="bunny">🐰</div>
    <h1>🎀 My Cute Task 🎀</h1>
    <p>สมุดจัดการงานแสนน่ารัก 💗</p>
</div>

<div class="stats">

<div class="stat">
    📝
    <div class="number" id="total">0</div>
    ทั้งหมด
</div>

<div class="stat">
    ⏰
    <div class="number" id="remaining">0</div>
    ค้าง
</div>

<div class="stat">
    🌟
    <div class="number" id="done">0</div>
    เสร็จ
</div>

</div>

<div class="card">

<h2>📊 ความคืบหน้า</h2>

<div class="percent" id="percent">0%</div>

<div class="progress">
    <div class="progress-bar" id="progressBar"></div>
</div>

<p id="message">🌱 มาเริ่มกันเลย!</p>

</div>

<div class="card">

<h2>🔔 การแจ้งเตือน</h2>

<p id="notificationStatus">
ยังไม่ได้เปิดการแจ้งเตือน
</p>

<button
    class="notify"
    onclick="enableNotifications()"
>
🔔 เปิดการแจ้งเตือน
</button>

</div>

<div class="card">

<h2>🌸 เพิ่มงาน</h2>

<label>📚 วิชา</label>

<input
    id="subject"
    placeholder="เช่น คณิตศาสตร์"
>

<label>📝 ชื่องาน</label>

<input
    id="task"
    placeholder="เช่น แบบฝึกหัดบทที่ 3"
>

<label>📅 วันส่ง</label>

<input id="date" type="date">

<label>⏰ เวลาส่ง</label>

<input id="time" type="time">

<label>🔔 แจ้งเตือนก่อนส่ง</label>

<select id="reminder">

<option value="0">ไม่แจ้งเตือน</option>
<option value="15">15 นาที</option>
<option value="30">30 นาที</option>
<option value="60" selected>1 ชั่วโมง</option>
<option value="180">3 ชั่วโมง</option>
<option value="360">6 ชั่วโมง</option>
<option value="720">12 ชั่วโมง</option>
<option value="1440">1 วัน</option>
<option value="2880">2 วัน</option>

</select>

<button class="save" onclick="addTask()">
💖 เพิ่มงาน
</button>

</div>

<div class="card">

<h2>🔎 ค้นหางาน</h2>

<input
    id="search"
    placeholder="ค้นหาวิชา หรือชื่องาน..."
    oninput="showTasks()"
>

</div>

<div class="card">

<h2>📋 งานของฉัน</h2>

<div id="taskList"></div>

</div>

</div>


<!-- Firebase -->

<script type="module">

import {
    initializeApp
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
    getMessaging,
    getToken,
    onMessage
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-messaging.js";


const firebaseConfig = {

    apiKey:
    "AIzaSyDZPsuZO1FUo3Ojp1MvKE8uO8_5MclVfX4",

    authDomain:
    "school-task-system-7231f.firebaseapp.com",

    projectId:
    "school-task-system-7231f",

    storageBucket:
    "school-task-system-7231f.firebasestorage.app",

    messagingSenderId:
    "188906340182",

    appId:
    "1:188906340182:web:70faaf5b69c0bfaa6260f7",

    measurementId:
    "G-ZR9C7Q3WFG"

};


const app =
    initializeApp(firebaseConfig);


const messaging =
    getMessaging(app);


/* VAPID PUBLIC KEY */

const VAPID_KEY =
"BBgWVXmr5MN5Lnm6RYuciLtHDzqEFNsclHAMCBBGzrlaiSLfkCR0YREvhCM10xv5s-AN3cVAFeXiGwMSYcXeMQA";


window.enableNotifications =
async function(){

    try{

        const permission =
            await Notification.requestPermission();

        if(permission !== "granted"){

            alert(
                "🥺 ต้องอนุญาตการแจ้งเตือนก่อนครับ"
            );

            return;

        }


        const registration =
            await navigator
            .serviceWorker
            .register(
                "./firebase-messaging-sw.js"
            );


        const token =
            await getToken(
                messaging,
                {
                    vapidKey:VAPID_KEY,
                    serviceWorkerRegistration:
                        registration
                }
            );


        if(token){

            localStorage.setItem(
                "fcmToken",
                token
            );

            document
            .getElementById(
                "notificationStatus"
            )
            .innerText =
            "✅ เปิดการแจ้งเตือนแล้วครับ 💗";

            alert(
                "🎉 เปิดการแจ้งเตือนสำเร็จแล้ว!"
            );

            console.log(
                "FCM TOKEN:",
                token
            );

        }

    }
    catch(error){

        console.error(error);

        alert(
            "❌ เปิดแจ้งเตือนไม่สำเร็จ\n\n" +
            error.message
        );

    }

};


onMessage(
    messaging,
    payload => {

        alert(
            "🔔 " +
            (
                payload.notification?.title
                ||
                "งานใกล้ถึงกำหนด!"
            ) +
            "\n\n" +
            (
                payload.notification?.body
                ||
                "มีงานที่ต้องส่งครับ 💗"
            )
        );

    }
);

</script>


<script>

/* =========================
   TASK SYSTEM
========================= */

let tasks =
JSON.parse(
    localStorage.getItem("tasks")
) || [];


function save(){

    localStorage.setItem(
        "tasks",
        JSON.stringify(tasks)
    );

}


function addTask(){

    const subject =
        document.getElementById("subject").value.trim();

    const task =
        document.getElementById("task").value.trim();

    const date =
        document.getElementById("date").value;

    const time =
        document.getElementById("time").value;

    const reminder =
        Number(
            document.getElementById("reminder").value
        );


    if(
        !subject ||
        !task ||
        !date ||
        !time
    ){

        alert(
            "🌸 กรุณากรอกข้อมูลให้ครบครับ"
        );

        return;

    }


    tasks.push({

        subject,
        task,
        date,
        time,
        reminder,

        completed:false,

        notified:false

    });


    save();

    showTasks();

    updateStats();


    document.getElementById("subject").value="";
    document.getElementById("task").value="";
    document.getElementById("date").value="";
    document.getElementById("time").value="";

}


function showTasks(){

    const list =
        document.getElementById("taskList");


    const search =
        document
        .getElementById("search")
        .value
        .toLowerCase();


    list.innerHTML="";


    const filtered =
        tasks.filter(
            x =>
            x.subject.toLowerCase().includes(search)
            ||
            x.task.toLowerCase().includes(search)
        );


    if(filtered.length===0){

        list.innerHTML =
        "<p style='text-align:center'>🐰 ยังไม่มีงานครับ 💗</p>";

        return;

    }


    filtered.forEach(
        item => {

            const index =
                tasks.indexOf(item);


            list.innerHTML += `

            <div class="task ${
                item.completed
                ? "completed"
                : ""
            }">

                <h3>
                    ${
                        item.completed
                        ? "🌟"
                        : "🌸"
                    }
                    ${item.subject}
                </h3>

                <p>📝 ${item.task}</p>

                <p>
                    📅 ${item.date}
                    <br>
                    ⏰ ${item.time}
                </p>

                <p>
                    🔔 ${reminderText(item.reminder)}
                </p>

                ${
                    !item.completed
                    ?
                    `
                    <button
                        class="done"
                        onclick="completeTask(${index})"
                    >
                        ✅ เสร็จแล้ว
                    </button>
                    `
                    :
                    "🎉 ทำเสร็จแล้ว!"
                }

                <button
                    class="delete"
                    onclick="deleteTask(${index})"
                >
                    🗑️ ลบ
                </button>

            </div>

            `;

        }
    );

}


function reminderText(x){

    const a={

        0:"ไม่แจ้งเตือน",
        15:"15 นาที",
        30:"30 นาที",
        60:"1 ชั่วโมง",
        180:"3 ชั่วโมง",
        360:"6 ชั่วโมง",
        720:"12 ชั่วโมง",
        1440:"1 วัน",
        2880:"2 วัน"

    };

    return a[x] || "ไม่แจ้งเตือน";

}


function completeTask(index){

    tasks[index].completed=true;

    save();

    showTasks();

    updateStats();

}


function deleteTask(index){

    if(
        confirm("🗑️ ลบงานนี้ไหมครับ?")
    ){

        tasks.splice(index,1);

        save();

        showTasks();

        updateStats();

    }

}


function updateStats(){

    const total =
        tasks.length;

    const done =
        tasks.filter(
            x=>x.completed
        ).length;

    const remaining =
        total-done;

    const percent =
        total===0
        ?0
        :Math.round(
            done/total*100
        );


    document.getElementById("total")
    .innerText=total;


    document.getElementById("done")
    .innerText=done;


    document.getElementById("remaining")
    .innerText=remaining;


    document.getElementById("percent")
    .innerText=percent+"%";


    document.getElementById("progressBar")
    .style.width=percent+"%";


    document.getElementById("message")
    .innerText =
        percent===100
        ? "🎉 เก่งมาก! เสร็จหมดแล้ว!"
        : percent>=50
        ? "✨ ใกล้เสร็จแล้ว!"
        : "🌱 ค่อย ๆ ทำไปนะ!";

}


showTasks();

updateStats();

</script>

</body>
</html>
